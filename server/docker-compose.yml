version: '3'
services:
  web:
    build: .
    env_file:
      - config.env
    volumes:
      - .:/app
    working_dir: /app
    # 启动前先运行初始化脚本（建表 + 补偿审核），然后启动 gunicorn
    # 单进程多线程足够本业务量；内容审核在 daemon 线程内异步执行，不占请求线程
    # max-requests 定期回收 worker 防内存缓慢增长
    command: sh -c "python init_db.py && gunicorn -w 1 -k gthread --threads 6 --max-requests 1000 --max-requests-jitter 100 -b 0.0.0.0:5000 app:app"
    mem_limit: 384m
    ports:
      - "5000:5000"
    environment:
      # 业务配置全部由 env_file(config.env) 注入；此处仅保留容器内部固定值
      - DATABASE_URL=sqlite:////app/data/treehole.db
