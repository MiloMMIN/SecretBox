version: '3'
services:
  web:
    build: . 
    env_file:
      - config.env
    volumes:
      - .:/app
    working_dir: /app
    # 启动前先运行初始化脚本，然后再启动 gunicorn
    # -w 2 足够本业务量；--preload 共享导入内存；max-requests 定期回收 worker 防内存缓慢增长
    command: sh -c "python init_db.py && gunicorn -w 2 --preload --max-requests 1000 --max-requests-jitter 100 -b 0.0.0.0:5000 app:app"
    mem_limit: 512m
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - WX_APP_ID=${WX_APP_ID}
      - WX_APP_SECRET=${WX_APP_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - EXTERNAL_URL=${EXTERNAL_URL}
    depends_on:
      - db
      - redis

  worker:
    build: .
    env_file:
      - config.env
    volumes:
      - .:/app
    working_dir: /app
    # 审核任务量小，concurrency 默认等于 CPU 核数会拉起过多子进程；限制为 2 并定期回收
    command: celery -A tasks worker --loglevel=info --concurrency=2 --max-tasks-per-child=200
    mem_limit: 384m
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    # 小库场景缩减默认内存：关闭 performance_schema，buffer pool 64M 起步
    command: >
      --default-authentication-plugin=mysql_native_password
      --performance_schema=OFF
      --innodb_buffer_pool_size=64M
      --innodb_log_buffer_size=8M
      --max_connections=50
      --table_open_cache=400
      --thread_cache_size=10
    mem_limit: 640m
    env_file:
      - config.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3377:3306"

  redis:
    image: redis:6-alpine
    mem_limit: 64m

  adminer:
    image: adminer
    restart: always
    mem_limit: 128m
    ports:
      - "8087:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db_data:
